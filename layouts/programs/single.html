{{ define "main" }}
<section class="bg-gradient-to-br from-black via-gray-950 to-purple-950 text-white py-16 px-6 md:px-12">
  <div class="max-w-3xl mx-auto bg-gray-900/90 rounded-2xl p-8 shadow-lg">
    <h1 class="text-4xl font-bold mb-6 text-purple-400">{{ .Title }}</h1>
    
    {{ if .Params.displayDate }}
      <p class="text-sm text-gray-400 mb-4">{{ .Params.displayDate }}</p>
    {{ else if .Date }}
      {{ if ne (.Date.Format "2006") "0001" }}
        <p class="text-sm text-gray-400 mb-4">{{ .Date | time.Format "Jan 2, 2006" }}</p>
      {{ end }}
    {{ end }}

    <!-- Featured Image -->
    {{ with .Params.image }}
      <div class="mb-6">
        <img src="{{ . | relURL }}" alt="{{ $.Title }}" class="rounded-xl shadow-lg mx-auto" />
      </div>
    {{ end }}
    
    <div class="prose prose-invert max-w-none">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}
