{{ define "main" }}
<section id="articles" class="relative bg-gradient-to-b from-black via-gray-900 to-purple-950 text-gray-200 py-24">
  <div class="max-w-screen-xl mx-auto px-6 text-center">
    <!-- Heading -->
    <h1 class="text-5xl font-extrabold text-purple-400 mb-6">
      {{ .Title }}
    </h1>

    <!-- Subtext -->
    <p class="max-w-2xl mx-auto text-lg text-gray-300 mb-12">
      {{ .Description }}
    </p>

    <!-- Coming soon box -->
    <div class="bg-gray-900 border border-purple-700 shadow-lg shadow-purple-500/30 rounded-2xl p-12 max-w-lg mx-auto">
      <h2 class="text-3xl font-bold text-white mb-4">🚧 Coming Soon</h2>
      <p class="text-gray-400">
        We’re working on publishing insightful articles, tutorials, and stories for the community.  
        Stay tuned!
      </p>
    </div>
  </div>
</section>
{{ end }}
