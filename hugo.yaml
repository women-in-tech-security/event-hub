  - assets/js/darkmode.js
enableInlineShortcodes: true

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: Nusser Studios
  authorimage: ../assets/images/global/WTS-Logo-Purple.svg
  og_image: /images/WTS-Logo-Purple.svg
  heroTitle: "Security For Everyone"
  moto: "Wo-Men In Tech Security"
  # moto2: "Women in Tech Security"
  description: "Women In Tech Security - Empowering women and raising cybersecurity awareness for everyone."
  disable_theme_toggle: false
  disable_stay_uptodate: false

  p1:
    heading: "Our vision and mission"
    image: "images/pages/our-mission.png"
    content:
      - text: "Our Vision: A diverse and inclusive world where everyone is fully aware of and actively takes care of their cybersecurity."
      - text: "Our Mission: A secure, inclusive digital landscape by fostering cybersecurity awareness and empowering individuals, especially women, to thrive in the cybersecurity field. We strive to:"
      - lists: 
        - "Increasing Cybersecurity Awareness: Educating the public about cybersecurity threats and effective digital protection strategies."
        - "Advancing Careers in Cybersecurity: Providing support, opportunities, and networks for individuals, particularly women, to build careers in the cybersecurity industry."
        - "Building Collaborative Community Networks: Forming a strong, collaborative community to facilitate the exchange of knowledge, ideas, and experiences."
        - "Encouraging Active Participation: Fostering an inclusive environment where everyone can contribute to creating a secure digital world."
  p2:
    heading: "Lorem Ipsum Dolor sit."
    image: "images/pages/hacktoberfest.jpg"
    content:
      - text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Curabitur at purus non enim commodo tincidunt vel in nulla. Aenean pretium dolor non ultricies bibendum. Etiam quis blandit enim. Nunc condimentum ut lorem in faucibus. Phasellus varius ligula et commodo tristique. Nunc sodales nisl nec laoreet vehicula. Donec velit nibh, sollicitudin at nulla a, egestas dignissim eros. Sed lacinia hendrerit interdum. Vestibulum pellentesque sem venenatis nisl tempor accumsan sit amet tempus felis. Mauris leo diam, porttitor nec bibendum id, tempus ac nulla. Etiam congue ornare erat at convallis. Donec in nisi dapibus, mattis risus vel, imperdiet enim. Donec fermentum sit amet tortor nec tincidunt. Nam nec lectus tortor. Nunc sit amet laoreet orci, porta ornare massa. Phasellus eget lorem mi. Nam eleifend ultricies sapien, quis mollis leo bibendum at. Quisque viverra lorem sit amet magna aliquet, et dignissim arcu eleifend."
  p3:
    heading: "Backed by renowned Security Specialist"
    content:
      - text: "Sagittis scelerisque nulla cursus in enim consectetur quam. Dictum urna sed consectetur neque tristique pellentesque. Blandit amet, sed aenean erat arcu morbi. Cursus faucibus nunc nisl netus morbi vel porttitor vitae ut. Amet vitae fames senectus vitae."
