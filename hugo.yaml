  p4:
    heading: "From the blog"
    content:
      - text: "Lorem ipsum dolor sit amet consectetur, adipisicing elit. Ipsa libero labore natus atque, ducimus sed."
  p5:
    heading: "Stay Up to Date"
    content:
      - text: "Sagittis scelerisque nulla cursus in enim consectetur quam. Dictum urna sed consectetur neque tristique pellentesque."
    action: "#"
    label: "Email address"
    placeholder: "Enter your email"
    button: "Notify me"
  p6:
    heading: "What is WTS?"
    content:
      - text: "Women In Tech Security (WTS) is an initiative aimed at building cybersecurity awareness and increasing community involvement, especially among women. We were founded as a community organization by young cybersecurity professionals with the goal of making an impact in cyberspace. \nThe name Women In Tech Security reflects our commitment to encompassing various aspects of technology that involve security. We aim to promote the importance of cybersecurity to the broader tech community, adapting to technological developments across different sectors. \nOur name highlights the crucial role of women in all aspects of technology and security. Importantly, our organization is not limited to women; we welcome and include everyone, regardless of background or gender, who shares our vision. Through this name, we hope to inspire more women and other tech professionals to engage and take an active role in the cybersecurity field."

  p7:
    heading: "Area of Topics"
    content:
      - text: "We cover a wide range of cybersecurity-related areas, including:"
    lists:
      - title: "Cyber Insecurity"
        description: "Encompasses the various risks and vulnerabilities posed by online threats such as malware, hacking, phishing, scams, fraud, and disinformation. It highlights the challenges individuals and organizations face in protecting their digital assets and personal information from cyberattacks and data breaches."
      - title: "Data Privacy, Protection, and Security"
        description: "Involves ensuring the confidentiality, integrity, and availability of sensitive information. This includes implementing measures to prevent unauthorized access, use, and disclosure of data, as well as safeguarding individuals' privacy rights. It also includes addressing societal trends that unknowingly lead to data leaks."
      - title: "Open Source Intelligence"
        description: "Involves gathering and analyzing publicly available information from various sources to generate insights and intelligence. It plays a crucial role in cybersecurity by providing valuable data for detecting scams, fraud, or threat actors that have been affecting our society for a long time."
      - title: "Cybersecurity Career"
        description: "Offers diverse opportunities for individuals interested in protecting digital assets and combating cyber threats. Roles such as security analysts, ethical hackers, and cybersecurity consultants typically require acquiring relevant skills, certifications, and experience in tech and security area."

  p8:
    heading: "How Can WTS Help You Get Involved?"
    content:
      - text: "Our organization provides different ways to engage and grow in cybersecurity:"
    lists:
      - "Content & Storytelling"
      - "Community & Networking"
      - "Events & Collaboration"
      - "Leadership & Empowerment"
    footer: "We engage members with insightful content, foster strong networks, facilitate impactful events, and cultivate leadership opportunities."

  social_media:
